name: Docker Image CI

on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - '**'
  pull_request:
    branches: [ "main", "develop" ]

jobs:

  build_and_push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set repo name and tag
      id: vars
      run: |
        # Get repo name from full repo path
        REPO_NAME=$(basename "$GITHUB_REPOSITORY")
        REPO_NAME=${REPO_NAME,,}

        # Check if it's a tag push
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
        else
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          # Replace slashes/underscores with hyphens for Docker tag safety
          TAG_NAME=$(echo "$BRANCH_NAME" | tr '/_' '--')
        fi
        NAMESPACE=${{ github.repository_owner }}
        NAMESPACE=${NAMESPACE,,}
        echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
        echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Private Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ secrets.PRIVATE_REGISTRY_URL }}
        username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
        password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        platforms: linux/amd64
        push: true
        context: .
        file: docker/Dockerfile
        tags: |
          ghcr.io/${{ steps.vars.outputs.namespace }}/${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
          ${{ secrets.PRIVATE_REGISTRY_URL }}/${{ secrets.MAAP_REGISTRY_NAMESPACE }}/${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
