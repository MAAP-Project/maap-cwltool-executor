name: Docker Image CI
on:
  push:
    branches: [ "main", "develop" ]
    tags:
      - '**'
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Description of run'
        required: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install pytest cwltool==3.1.20250110105449 cwl_utils==0.35 PyYAML pystac==1.15.2 maap-py requests "urllib3>=2"
    - name: Run tests
      run: pytest tests

  build_and_push:
    needs: test

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7
    - name: Set repo name and tag
      id: vars
      run: |
        # Get repo name from full repo path
        REPO_NAME=$(basename "$GITHUB_REPOSITORY")
        REPO_NAME=${REPO_NAME,,}

        # Check if it's a tag push
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG_NAME=${GITHUB_REF#refs/tags/}
        else
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          # Replace slashes/underscores with hyphens for Docker tag safety
          TAG_NAME=$(echo "$BRANCH_NAME" | tr '/_' '--')
        fi
        NAMESPACE=${{ github.repository_owner }}
        NAMESPACE=${NAMESPACE,,}
        echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
        echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Private Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ secrets.PRIVATE_REGISTRY_URL }}
        username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
        password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        platforms: linux/amd64
        push: true
        context: .
        file: docker/Dockerfile
        tags: |
          ghcr.io/${{ steps.vars.outputs.namespace }}/${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
          ${{ secrets.PRIVATE_REGISTRY_URL }}/${{ secrets.MAAP_REGISTRY_NAMESPACE }}/${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.tag }}
